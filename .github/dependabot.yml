# Dependabot — dependency security alerts and update PRs.
# Free on private repositories. Version-update PRs are grouped to keep the
# noise down; security fixes are always opened individually and immediately.
# A 7-day cooldown delays adopting a newly-published version — a window against
# compromised/yanked releases (supply-chain hardening).
version: 2
updates:
  # Frontend (React/Vite) — root package.json / package-lock.json.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      # Roll routine minor/patch bumps into one PR per week.
      frontend-minor-patch:
        update-types:
          - minor
          - patch

  # Backend (.NET) — NuGet packages referenced by the API project.
  - package-ecosystem: nuget
    directory: "/server"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      backend-minor-patch:
        update-types:
          - minor
          - patch

  # Keep the GitHub Actions used in CI current (checkout, setup-node, etc.).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
