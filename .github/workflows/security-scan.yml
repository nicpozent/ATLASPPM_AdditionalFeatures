name: Security scan

# Automated application-security scanning — the automated half of a penetration
# test (ADR-0051). SAST (Semgrep) reads the source for vulnerable patterns; the
# dependency/secret/config scan (Trivy) looks at what ships; DAST (OWASP ZAP)
# probes a *running* deployment from the outside.
#
# SAST + Trivy are GATING (they fail the build on findings) as of the baseline
# triage in ADR-0053 — the baseline is clean after fixing the real issues and
# recording scoped, documented exceptions (.semgrepignore, .trivyignore.yaml, and
# the Semgrep --exclude-rule list below; rationale in security-hardening.md §6).
# ZAP is dispatch-only and points at a running environment you choose — the same
# "run against a test server" model as the k6 perf suite (ADR-0047).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # Monday 04:00 UTC — weekly sweep
  workflow_dispatch:
    inputs:
      zap_target:
        description: "URL for the OWASP ZAP baseline (DAST) scan, e.g. https://atlas-test.internal"
        required: false
        default: ""

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- SAST — static analysis of the source (C# + TypeScript) ---------------
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Semgrep (OWASP Top 10 + security-audit + secrets)
        run: |
          python -m pip install --quiet semgrep
          # Gating (--error): a finding fails the build. Baseline is clean after
          # ADR-0053 triage. Excluded rules are documented, accepted CI-policy /
          # by-design exceptions (see security-hardening.md §6):
          #  - mutable-action-tag: actions pinned to major versions, kept current
          #    by Dependabot's github-actions ecosystem.
          #  - gha-curl-pipe-shell: the official Trivy installer over TLS.
          #  - nginx request-host/dynamic-proxy/missing-internal: standard
          #    same-origin reverse proxy; the upstream is an internal config value.
          #  - dockerfile missing-user: nginx edge master binds 80/443 (see
          #    .trivyignore.yaml).
          semgrep scan --error \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config p/secrets \
            --exclude-rule yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag \
            --exclude-rule yaml.github-actions.security.gha-curl-pipe-shell.gha-curl-pipe-shell \
            --exclude-rule generic.nginx.security.request-host-used.request-host-used \
            --exclude-rule generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host \
            --exclude-rule generic.nginx.security.missing-internal.missing-internal \
            --exclude-rule dockerfile.security.missing-user.missing-user \
            --metrics off \
            --oss-only \
            --disable-version-check

  # ---- Dependencies · secrets · config (Trivy) ------------------------------
  deps:
    name: Dependencies · secrets · IaC (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      - name: Trivy filesystem scan (gating)
        # Gating: exit 1 on any HIGH/CRITICAL. Baseline clean after ADR-0053
        # (API image runs non-root; the nginx-edge DS-0002 is a scoped, documented
        # exception in .trivyignore.yaml).
        run: trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1 --no-progress .

  # ---- DAST — probe a running deployment from the outside (OWASP ZAP) -------
  # Dispatch-only: DAST needs a live target, so point it at a running test
  # environment (never production). Non-gating baseline (passive + safe active).
  dast:
    name: DAST (OWASP ZAP baseline)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.zap_target != ''
    runs-on: ubuntu-latest
    steps:
      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ github.event.inputs.zap_target }}
          fail_action: false
          allow_issue_writing: false
          cmd_options: "-I" # don't fail on warnings; report only
