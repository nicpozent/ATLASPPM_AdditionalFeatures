name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Supply-chain gate — fail only on high/critical advisories in
      # dependencies that actually ship. Dev-only toolchain advisories
      # (vite/esbuild/vitest) don't reach production and are handled by
      # Dependabot PRs, so they don't block the build.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - name: Test with coverage
        run: npm run test:coverage
      # Surface line/branch coverage in the job summary and enforce a floor so it
      # can't backslide. FLOOR sits a few points below today's line rate — raise it
      # as the god-object screens are split and gain tests (R13/R18). Mirrors the
      # backend floor below.
      - name: Coverage summary + floor
        run: |
          FLOOR=6.0
          f=coverage/coverage-summary.json
          [ -f "$f" ] || { echo "::error::no coverage summary produced"; exit 1; }
          line=$(node -p "require('./coverage/coverage-summary.json').total.lines.pct")
          branch=$(node -p "require('./coverage/coverage-summary.json').total.branches.pct")
          {
            echo "### Frontend coverage"
            echo "- **Line:** ${line}%  (floor ${FLOOR}%)"
            echo "- **Branch:** ${branch}%"
          } >> "$GITHUB_STEP_SUMMARY"
          below=$(awk "BEGIN{print ($line < $FLOOR) ? 1 : 0}")
          if [ "$below" = "1" ]; then
            echo "::error::Frontend line coverage ${line}% is below the ${FLOOR}% floor."
            exit 1
          fi
          echo "Frontend line coverage ${line}% meets the ${FLOOR}% floor."
      - run: npm run build

  a11y:
    name: Accessibility (Playwright + axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Only Chromium is needed for the full-page axe sweep. Install just the
      # browser binary (no --with-deps): ubuntu-latest already ships Chromium's
      # shared libraries, and --with-deps runs apt against packages.microsoft.com,
      # which intermittently fails with a signature error and flakes the job.
      - run: npx playwright install chromium
      - run: npm run build
      # Serves the built app (vite preview) with no backend → empty states —
      # enough to run axe over the real DOM. Structural violations fail the job;
      # colour-contrast is reported but not gated (see ADR-0033).
      - run: npm run test:e2e

  backend:
    name: API (build · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1  # v5.4.0
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore Atlas.sln
      # Supply-chain gate — fail if any referenced NuGet package (including
      # transitive) has a known vulnerability. `dotnet list` exits 0 either
      # way, so detect the finding in its output and fail explicitly.
      - name: Check for vulnerable NuGet packages
        run: |
          dotnet list Atlas.Api.csproj package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then
            echo "::error::Vulnerable NuGet packages detected — see the list above."
            exit 1
          fi
      - run: dotnet build Atlas.sln -c Release --no-restore
      - name: Test with coverage
        run: dotnet test Atlas.sln -c Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --settings coverlet.runsettings --results-directory TestResults
      # Surface line/branch coverage in the job summary and enforce a floor so
      # coverage can't silently backslide. FLOOR is set a few points below the
      # current line rate — raise it as coverage climbs.
      - name: Coverage summary + floor
        run: |
          FLOOR=65.0
          f=$(find TestResults -name coverage.cobertura.xml | head -1)
          [ -z "$f" ] && { echo "::error::no coverage file produced"; exit 1; }
          line=$(grep -oE 'line-rate="[0-9.]+"' "$f" | head -1 | grep -oE '[0-9.]+')
          branch=$(grep -oE 'branch-rate="[0-9.]+"' "$f" | head -1 | grep -oE '[0-9.]+')
          pct() { awk "BEGIN{printf \"%.1f\", $1*100}"; }
          linePct=$(pct "$line"); branchPct=$(pct "$branch")
          {
            echo "### Backend coverage (migrations excluded)"
            echo "- **Line:** ${linePct}%  (floor ${FLOOR}%)"
            echo "- **Branch:** ${branchPct}%"
          } >> "$GITHUB_STEP_SUMMARY"
          below=$(awk "BEGIN{print ($linePct < $FLOOR) ? 1 : 0}")
          if [ "$below" = "1" ]; then
            echo "::error::Line coverage ${linePct}% is below the ${FLOOR}% floor."
            exit 1
          fi
          echo "Line coverage ${linePct}% meets the ${FLOOR}% floor."
