# ============================================================================
#  Atlas PPM — full-stack compose.
#  `web`  : this repo's frontend, built and served by nginx (same-origin /api).
#  `api`  : the separate .NET backend. It lives in another repo, so supply it
#           either as a prebuilt image (ATLAS_API_IMAGE) or by pointing the
#           commented `build:` at a local checkout.
#
#  Frontend only:   docker compose up --build           (default)
#  With backend:    docker compose --profile api up --build   (needs an image)
#  Frontend:        http://localhost:${WEB_PORT:-8080}
#
#  The `api` service is behind the `api` profile, so a plain `up` runs only the
#  frontend — it needs no backend image. nginx resolves the API lazily, so /api
#  just returns 502 until the backend is present and the SPA shows empty states.
# ============================================================================
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Public build-time config (baked into the bundle). Fill for real SSO.
        VITE_AUTH_ENABLED: ${VITE_AUTH_ENABLED:-false}
        VITE_AUTH_TENANT_ID: ${VITE_AUTH_TENANT_ID:-}
        VITE_AUTH_CLIENT_ID: ${VITE_AUTH_CLIENT_ID:-}
        VITE_API_AUDIENCE: ${VITE_API_AUDIENCE:-api://atlas-ppm}
        VITE_API_BASE: /api/v1
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

  api:
    # Only started with `--profile api` (the .NET backend lives in another repo).
    profiles: ["api"]
    # Option A (default): pull a prebuilt backend image.
    image: ${ATLAS_API_IMAGE:-atlas-ppm-api:latest}
    # Option B: build from a sibling checkout of the backend repo instead —
    # comment out `image:` above and uncomment:
    # build: ../atlas-ppm-api
    environment:
      ASPNETCORE_URLS: http://+:8080
      # Add the backend's own config here (connection strings, Entra API
      # audience/authority for token validation, etc.).
    expose:
      - "8080"
    restart: unless-stopped
