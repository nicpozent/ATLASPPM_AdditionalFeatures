# Atlas PPM frontend — nginx serving the SPA and proxying /api to the backend.
# The API is same-origin behind this server (no CORS): /api/* -> api service.

upstream atlas_api {
  # `api` is the docker-compose service name; 8080 is the .NET Kestrel port.
  server api:8080;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Gzip text assets.
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Long-cache fingerprinted build assets.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # REST API — same-origin reverse proxy. Preserves the full /api/v1/... path.
  location /api/ {
    proxy_pass http://atlas_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # SPA history fallback — every other route serves index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Don't cache the HTML entry point (so new deploys are picked up).
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
