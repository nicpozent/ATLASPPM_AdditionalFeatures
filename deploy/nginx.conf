# Atlas PPM frontend — nginx serving the SPA over HTTPS and proxying /api to
# the backend. TLS is terminated here with a bring-your-own certificate mounted
# at /etc/nginx/certs (see docs/SETUP.md). HTTP is redirected to HTTPS —
# required because Entra only accepts HTTPS redirect URIs off localhost.

# HTTP -> HTTPS redirect.
server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/atlas.crt;
  ssl_certificate_key /etc/nginx/certs/atlas.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;

  root /usr/share/nginx/html;
  index index.html;

  # Security headers for the app shell (defence-in-depth; the API sets its own).
  # No Content-Security-Policy yet — the app is fully inline-styled, so CSP needs
  # a dedicated report-only rollout (tracked separately).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Long-cache fingerprinted build assets.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # REST API — same-origin reverse proxy. Resolve the upstream lazily via
  # Docker's embedded DNS so nginx boots even when the api isn't up yet.
  location /api/ {
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $atlas_api "api:8080";
    proxy_pass http://$atlas_api$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # PI Program Board SignalR hub — same-origin reverse proxy with WebSocket
  # upgrade. Long read timeout so idle sockets aren't dropped mid-session.
  location /hubs/ {
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $atlas_hub "api:8080";
    proxy_pass http://$atlas_hub$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }

  # SPA history fallback — every other route serves index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Don't cache the HTML entry point (so new deploys are picked up).
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }
}
