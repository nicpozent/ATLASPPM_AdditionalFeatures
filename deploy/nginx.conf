# Atlas PPM frontend — nginx serving the SPA and proxying /api to the backend.
# The API is same-origin behind this server (no CORS): /api/* -> api service.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Gzip text assets.
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Long-cache fingerprinted build assets.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # REST API — same-origin reverse proxy. Preserves the full /api/v1/... path.
  # Resolve the upstream lazily via Docker's embedded DNS (127.0.0.11) and a
  # variable proxy_pass, so nginx BOOTS even when the api service isn't running
  # (frontend-only runs). Without the backend, /api simply returns 502 and the
  # SPA falls back to its empty states.
  location /api/ {
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $atlas_api "api:8080";
    proxy_pass http://$atlas_api$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # SPA history fallback — every other route serves index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Don't cache the HTML entry point (so new deploys are picked up).
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
