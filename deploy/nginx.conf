# Atlas PPM frontend — nginx serving the SPA over HTTPS and proxying /api to
# the backend. TLS is terminated here with a bring-your-own certificate mounted
# at /etc/nginx/certs (see docs/SETUP.md). HTTP is redirected to HTTPS —
# required because Entra only accepts HTTPS redirect URIs off localhost.

# WebSocket upgrade for the SignalR hub, constrained to the `websocket` value
# only. Both the Upgrade and Connection headers are derived from a map instead
# of forwarding the raw client Upgrade token: a genuine WebSocket request gets
# `Upgrade: websocket` + `Connection: upgrade`, and anything else (SignalR's
# SSE/long-poll fallbacks, or a smuggled `Upgrade: h2c`) gets both headers
# cleared. That prevents an HTTP/2-cleartext upgrade from being smuggled past
# this reverse proxy to the backend (Semgrep possible-nginx-h2c-smuggling; see
# docs/security-hardening.md).
map $http_upgrade $atlas_ws_upgrade {
  default   "";
  websocket "websocket";
}
map $http_upgrade $atlas_ws_connection {
  default   "";
  websocket "upgrade";
}

# HTTP -> HTTPS redirect, plus a plaintext health endpoint for the container
# healthcheck. The healthcheck probes /healthz over plain HTTP so it doesn't
# depend on TLS or on BusyBox wget's (absent) HTTPS support — see Dockerfile.
server {
  listen 80;
  server_name _;

  # Container HEALTHCHECK target — not redirected, no TLS, no access-log noise.
  # No add_header here: adding one in a location block silently drops any
  # server-block headers for this location (Semgrep nginx header-redefinition),
  # and the health probe only needs the 200 status. default_type covers the body.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Everything else redirects to HTTPS.
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/atlas.crt;
  ssl_certificate_key /etc/nginx/certs/atlas.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  # Modern, forward-secret AEAD suites only (Mozilla "intermediate" for TLS1.2;
  # TLS1.3 suites are fixed by the protocol). Drops the non-PFS / CBC / RSA-kx
  # ciphers that the broad "HIGH" alias still permitted.
  ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers on;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;

  root /usr/share/nginx/html;
  index index.html;

  # Security headers for the app shell (defence-in-depth; the API sets its own).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # Content-Security-Policy. script-src 'self' is the real XSS control — the build
  # has no inline script (one external module entry). style-src keeps 'unsafe-inline'
  # because the app is 100% inline-styled by design (ADR-0003); style injection
  # can't execute JS, so this is an accepted, bounded concession. login.microsoftonline.com
  # is allowed in connect-/frame-src only for the optional Entra SSO flow (inert when
  # auth is off). Uploaded files download as attachments (nosniff + Content-Disposition),
  # so they never render in this origin. See docs/security-hardening.md.
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://login.microsoftonline.com; frame-src 'self' https://login.microsoftonline.com; worker-src 'self' blob:; upgrade-insecure-requests" always;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Long-cache fingerprinted build assets.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # REST API — same-origin reverse proxy. Resolve the upstream lazily via
  # Docker's embedded DNS so nginx boots even when the api isn't up yet.
  location /api/ {
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $atlas_api "api:8080";
    proxy_pass http://$atlas_api$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # PI Program Board SignalR hub — same-origin reverse proxy with WebSocket
  # upgrade. Long read timeout so idle sockets aren't dropped mid-session.
  location /hubs/ {
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $atlas_hub "api:8080";
    proxy_pass http://$atlas_hub$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $atlas_ws_upgrade;
    proxy_set_header Connection $atlas_ws_connection;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }

  # SPA history fallback — every other route serves index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Don't cache the HTML entry point (so new deploys are picked up). This block
  # redefines add_header, so nginx does NOT inherit the server-block headers here
  # — every security header (incl. the CSP) must be repeated.
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://login.microsoftonline.com; frame-src 'self' https://login.microsoftonline.com; worker-src 'self' blob:; upgrade-insecure-requests" always;
  }
}
