# Postgres client authentication for PASSWORDLESS (client-certificate) auth.
# Mounted by docker-compose.pgcert.yml as the server's hba_file.
#
#  • local  (unix socket): trust — used only inside the container for init and the
#    pg_isready healthcheck; not reachable from outside the container.
#  • hostssl (TCP): require TLS AND a valid client certificate whose CN equals the
#    database role ("cert clientcert=verify-full"). There is no password path over
#    TCP, so a leaked/absent password is irrelevant — only a cert signed by the
#    mounted CA, with CN = the login role, is accepted.
#
# TYPE      DATABASE  USER  ADDRESS         METHOD
local       all       all                   trust
hostssl     all       all   0.0.0.0/0       cert clientcert=verify-full
hostssl     all       all   ::/0            cert clientcert=verify-full
