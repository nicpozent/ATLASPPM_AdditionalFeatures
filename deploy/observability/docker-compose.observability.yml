# ============================================================================
#  Atlas PPM — reference observability stack (OpenTelemetry backends).
#
#  An OVERLAY compose file: run it alongside the main stack so the API's OTLP
#  telemetry (ADR-0010) has somewhere to land and be visualised.
#
#    docker compose -f docker-compose.yml -f deploy/observability/docker-compose.observability.yml up --build
#
#  Pipeline:  api --OTLP--> otel-collector --> Tempo (traces)
#                                          --> Prometheus (metrics, scraped)
#                                          --> Loki (logs)
#             Grafana reads all three (datasources pre-provisioned).
#
#  Grafana:   http://localhost:${GRAFANA_PORT:-3000}  (admin / admin by default)
#
#  This is a REFERENCE for self-hosting; production would point OTEL at a managed
#  backend instead (Azure Monitor, Grafana Cloud, …) — see docs/observability.md.
# ============================================================================
services:
  # Turn the API's telemetry on and point it at the collector. Merges with the
  # api service defined in docker-compose.yml.
  api:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "atlas-api"
    depends_on:
      - otel-collector

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC (also reachable in-network as otel-collector:4317)
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - tempo
      - loki
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./deploy/observability/tempo.yaml:/etc/tempo.yaml:ro
      - atlas_tempo:/var/tempo
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./deploy/observability/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - atlas_loki:/loki
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - atlas_prometheus:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - atlas_grafana:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
      - loki
    restart: unless-stopped

volumes:
  atlas_tempo:
  atlas_loki:
  atlas_prometheus:
  atlas_grafana:
