global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # The OTel Collector re-exposes the API's OTLP metrics as a Prometheus
  # scrape target on :8889 (see otel-collector.yaml).
  - job_name: atlas-api
    static_configs:
      - targets: ["otel-collector:8889"]
  # The collector's own internal telemetry.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
