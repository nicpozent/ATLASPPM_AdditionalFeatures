# ============================================================================
#  Docker-secrets overlay (OPT-IN) — keeps the database password out of
#  environment variables and `docker inspect`, reading it from files mounted at
#  /run/secrets instead. The base docker-compose.yml is unchanged; this only
#  applies when we name it explicitly:
#
#    sh deploy/gen-secrets.sh                      # once, to create the files
#    docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
#
#  See docs/secrets.md for the full walkthrough and the volume-already-exists
#  gotcha (Postgres only sets its password on first initialisation).
# ============================================================================
services:
  db:
    environment:
      # Postgres reads its password from the mounted file, not an env var.
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password

  api:
    environment:
      # Blank so no password appears in `docker inspect`; the mounted secret
      # file (/run/secrets/ConnectionStrings__Postgres) overrides this by design
      # — the app's secret layer is added after env vars (see docs/secrets.md).
      ConnectionStrings__Postgres: ""
    secrets:
      - ConnectionStrings__Postgres

secrets:
  db_password:
    file: ./secrets/db_password.txt
  ConnectionStrings__Postgres:
    file: ./secrets/pg_conn.txt
